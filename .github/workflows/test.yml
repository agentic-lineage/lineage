name: Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.txt
          {
            echo "## Test Coverage"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  # Keep a stable check name for branch protection while preserving the
  # per-platform matrix results above for diagnostics.
  go-required:
    name: Go
    needs: go
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Go matrix jobs to pass
        env:
          MATRIX_RESULT: ${{ needs.go.result }}
        run: test "$MATRIX_RESULT" = "success"
